name: macOS viewer probe

# Whether a macOS runner can host the viewer: a desktop session, the
# graphics it offers, and an Open CASCADE window drawn with OpenGL, with
# hardware acceleration and in software, each with a screenshot.  Run by
# hand.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Open CASCADE window on a macOS runner
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Install Open CASCADE
        shell: bash
        run: |
          set -euo pipefail
          brew install opencascade
          brew list --versions opencascade

      - name: Describe the session
        shell: bash
        run: |
          sw_vers
          echo "launchctl session: $(launchctl managername)"
          system_profiler SPDisplaysDataType || true

      - name: Build the probe
        shell: bash
        run: |
          set -euo pipefail
          cat > probe.mm <<'EOF'
          // What graphics a macOS runner offers, and whether Open CASCADE can draw
          // in a window there: a Metal device, OpenGL accelerated and in software,
          // then an Open CASCADE window with a shaded box, with hardware acceleration
          // and without.  Each attempt reports the OpenGL in use, whether its window
          // is on screen, and how much of an offscreen render of the view is not
          // background, saves that render and takes a screenshot.
          #import <Cocoa/Cocoa.h>
          #import <Metal/Metal.h>
          #import <OpenGL/gl.h>
          #import <OpenGL/CGLRenderers.h>
          #include <AIS_InteractiveContext.hxx>
          #include <AIS_Shape.hxx>
          #include <Aspect_DisplayConnection.hxx>
          #include <BRepPrimAPI_MakeBox.hxx>
          #include <Cocoa_Window.hxx>
          #include <Image_AlienPixMap.hxx>
          #include <OpenGl_GraphicDriver.hxx>
          #include <Standard_Version.hxx>
          #include <TColStd_IndexedDataMapOfStringString.hxx>
          #include <V3d_View.hxx>
          #include <V3d_Viewer.hxx>
          #include <cstdio>
          #include <cstdlib>
          #include <string>

          static void
          pump (double seconds, const Handle (V3d_View)& view)
          {
            NSDate *until = [NSDate dateWithTimeIntervalSinceNow: seconds];
            while ([until timeIntervalSinceNow] > 0)
            {
              NSEvent *e = [NSApp nextEventMatchingMask: NSEventMaskAny
                            untilDate: [NSDate dateWithTimeIntervalSinceNow: 0.05]
                            inMode: NSDefaultRunLoopMode dequeue: YES];
              if (e)
                [NSApp sendEvent: e];
              if (! view.IsNull ())
                view->Redraw ();
            }
          }

          static void
          step (const char *what)
          {
            printf ("  step: %s\n", what);
            fflush (stdout);
          }

          // OpenGL through Cocoa alone, with the attributes given
          static void
          nativegl (const char *name, const NSOpenGLPixelFormatAttribute *attr)
          {
            NSOpenGLPixelFormat *pf = [[NSOpenGLPixelFormat alloc] initWithAttributes: attr];
            if (! pf)
            {
              printf ("OpenGL %s: no pixel format\n", name);
              return;
            }
            NSOpenGLContext *c = [[NSOpenGLContext alloc] initWithFormat: pf shareContext: nil];
            if (! c)
            {
              printf ("OpenGL %s: pixel format, but no context\n", name);
              return;
            }
            [c makeCurrentContext];
            printf ("OpenGL %s: %s, %s\n", name, (const char *) glGetString (GL_RENDERER),
                    (const char *) glGetString (GL_VERSION));
            [NSOpenGLContext clearCurrentContext];
          }

          static void
          occtview (bool noaccel, double hold)
          {
            const std::string tag = noaccel ? "software" : "accelerated";
            printf ("Open CASCADE view, %s:\n", tag.c_str ());
            fflush (stdout);
            Handle (V3d_View) view;
            try
            {
              step ("graphic driver");
              Handle (Aspect_DisplayConnection) dc = new Aspect_DisplayConnection ();
              Handle (OpenGl_GraphicDriver) drv = new OpenGl_GraphicDriver (dc, false);
              drv->ChangeOptions ().contextNoAccel = noaccel;
              step ("viewer");
              Handle (V3d_Viewer) viewer = new V3d_Viewer (drv);
              viewer->SetDefaultLights ();
              viewer->SetLightOn ();
              step ("window");
              Handle (Cocoa_Window) win
                = new Cocoa_Window (("drafting probe, " + tag).c_str (), 100, 100, 640, 480);
              step ("view");
              view = viewer->CreateView ();
              view->SetWindow (win);
              view->SetBackgroundColor (Quantity_Color (Quantity_NOC_WHITE));
              if (! win->IsMapped ())
                win->Map ();
              [NSApp activateIgnoringOtherApps: YES];
              step ("shape");
              Handle (AIS_InteractiveContext) ctx = new AIS_InteractiveContext (viewer);
              ctx->Display (new AIS_Shape (BRepPrimAPI_MakeBox (10, 20, 30).Shape ()),
                            AIS_Shaded, 0, true);
              view->SetProj (V3d_XposYnegZpos);
              view->FitAll ();
              pump (1, view);

              NSView *nv = (NSView *) win->HView ();
              printf ("  window on screen: %d, backing scale %.1f\n",
                      (int) [[nv window] isVisible], [[nv window] backingScaleFactor]);
              TColStd_IndexedDataMapOfStringString info;
              view->DiagnosticInformation (info, Graphic3d_DiagnosticInfo_Basic);
              for (TColStd_IndexedDataMapOfStringString::Iterator it (info); it.More ();
                   it.Next ())
                printf ("  %s: %s\n", it.Key ().ToCString (), it.Value ().ToCString ());

              step ("offscreen render");
              Image_AlienPixMap img;
              const bool ok = view->ToPixMap (img, 640, 480);
              long ink = 0;
              if (ok)
                for (Standard_Size y = 0; y < img.SizeY (); y++)
                  for (Standard_Size x = 0; x < img.SizeX (); x++)
                  {
                    const Quantity_Color c = img.PixelColor ((int) x, (int) y).GetRGB ();
                    if (c.Red () < 0.9 || c.Green () < 0.9 || c.Blue () < 0.9)
                      ink++;
                  }
              printf ("  offscreen render: %s, %ld of %zu pixels not background\n",
                      ok ? "done" : "failed", ink, (size_t) (img.SizeX () * img.SizeY ()));
              if (ok)
                img.Save (("probe-render-" + tag + ".png").c_str ());
              pump (1, view);
              std::system (("screencapture -x screen-" + tag + ".png").c_str ());
              printf ("  screenshot taken\n");
              pump (hold, view);
              win->Unmap ();
            }
            catch (const Standard_Failure& e)
            {
              printf ("  failed: %s: %s\n", e.DynamicType ()->Name (), e.GetMessageString ());
            }
            catch (...)
            {
              printf ("  failed: an exception not of Open CASCADE\n");
            }
            fflush (stdout);
          }

          int
          main (int argc, char **argv)
          {
            const double hold = argc > 1 ? std::atof (argv[1]) : 2;
            @autoreleasepool
            {
              [NSApplication sharedApplication];
              [NSApp setActivationPolicy: NSApplicationActivationPolicyRegular];
              printf ("OCCT %s\n", OCC_VERSION_COMPLETE);

              id<MTLDevice> dev = MTLCreateSystemDefaultDevice ();
              printf ("Metal device: %s\n", dev ? [[dev name] UTF8String] : "none");

              const NSOpenGLPixelFormatAttribute acc[] = {
                NSOpenGLPFAAccelerated, NSOpenGLPFADoubleBuffer, NSOpenGLPFAColorSize, 24,
                NSOpenGLPFADepthSize, 24, 0};
              const NSOpenGLPixelFormatAttribute sw[] = {
                NSOpenGLPFARendererID, kCGLRendererGenericFloatID, NSOpenGLPFADoubleBuffer,
                NSOpenGLPFAColorSize, 24, NSOpenGLPFADepthSize, 24, 0};
              nativegl ("accelerated", acc);
              nativegl ("software", sw);
              fflush (stdout);

              occtview (false, hold);
              occtview (true, hold);
            }
            return 0;
          }
          EOF
          inc=/opt/homebrew/include/opencascade
          clang++ -std=c++17 -ObjC++ -Wno-deprecated-declarations -I"$inc" \
            probe.mm -o probe -L/opt/homebrew/lib -lTKernel -lTKMath -lTKG3d \
            -lTKBRep -lTKTopAlgo -lTKPrim -lTKService -lTKV3d -lTKOpenGl \
            -framework Cocoa -framework Metal -framework OpenGL

      - name: Run it
        shell: bash
        run: ./probe 2 2>&1 | tee probe.log

      - name: Upload what it saw
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-probe
          path: |
            probe.log
            probe-render-*.png
            screen-*.png
          if-no-files-found: ignore
          retention-days: 14
